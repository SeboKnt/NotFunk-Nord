<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frequenzen - NotFunk-Nord</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Zum Inhalt springen</a>

  <nav class="site-nav" role="navigation" aria-label="Hauptnavigation">
    <div class="nav-inner">
      <a href="/" class="logo" aria-label="NotFunk-Nord Startseite">
        <div class="logo-mark" aria-hidden="true">NF</div>
        <span>NotFunk-Nord</span>
      </a>
      <ul class="nav-links" id="nav-links">
        <li><a href="/">Start</a></li>
        <li><a href="/tools">Tools</a></li>
        <li><a href="/frequencies" aria-current="page">Frequenzen</a></li>
        <li><a href="/map">Karte</a></li>
        <li><a href="/about">Über</a></li>
      </ul>
      <div class="nav-meta">
        <span class="status-indicator">
          <span class="status-dot" aria-hidden="true"></span>
          <span>ONLINE</span>
        </span>
        <span id="utc-clock" aria-live="polite"></span>
      </div>
      <button class="menu-toggle" aria-label="Menü öffnen" aria-expanded="false" aria-controls="nav-links">&#9776;</button>
    </div>
  </nav>

  <main id="main-content">
    <div class="container">
      <div class="page-header">
        <h1><span>Frequenzen</span> &amp; Bänder</h1>
        <p>Notfunk-Frequenzen für Deutschland, D/A/CH und international.</p>
      </div>

      <div class="search-bar">
        <input type="search" id="search-input" placeholder="Suchen nach Frequenz, Band oder Modus..." aria-label="Frequenzen durchsuchen" oninput="AppFreq.filterFrequencies()">
        <button class="btn btn-sm btn-outline" onclick="AppFreq.clearSearch()">Löschen</button>
      </div>

      <div class="filter-bar" role="group" aria-label="Filter nach Bandart">
        <button class="filter-btn active" aria-pressed="true" onclick="AppFreq.filterByBand('all', this)">Alle</button>
        <button class="filter-btn" aria-pressed="false" onclick="AppFreq.filterByBand('kw', this)">Kurzwelle</button>
        <button class="filter-btn" aria-pressed="false" onclick="AppFreq.filterByBand('ukw', this)">Ultrakurzwelle</button>
        <button class="filter-btn" aria-pressed="false" onclick="AppFreq.filterByBand('dach', this)">D/A/CH</button>
      </div>

      <div id="frequencies-list" aria-live="polite">
        <!-- Dynamically populated -->
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>NotFunk-Nord.de | Cloudflare Workers + Hono.js | MIT Lizenz</p>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/frequencies.js"></script>
</body>
</html>
