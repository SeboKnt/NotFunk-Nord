<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frequenzen - NotFunk-Nord</title>
  <link rel="stylesheet" href="/css/base.css">
  <style>
    .freq-group {
      margin-bottom: 2rem;
    }

    .freq-group h3 {
      font-size: 0.9rem;
      color: var(--accent);
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .search-box {
      margin-bottom: 1.5rem;
      display: flex;
      gap: 0.5rem;
    }

    .search-box input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .tag {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 0.2rem 0.5rem;
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-right: 0.25rem;
    }

    .tag.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/" class="logo">
        <div class="logo-icon">⚡</div>
        <span>NotFunk-Nord</span>
      </a>
      <ul class="nav-links">
        <li><a href="/">Start</a></li>
        <li><a href="/tools">Tools</a></li>
        <li><a href="/frequencies" class="active">Frequenzen</a></li>
        <li><a href="/map">Karte</a></li>
        <li><a href="/about">Über</a></li>
      </ul>
      <div class="nav-right">
        <span><span class="status-dot"></span> ONLINE</span>
        <span id="clock"></span>
      </div>
      <button class="menu-toggle" onclick="document.querySelector('.nav-links').classList.toggle('show')">☰</button>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="page-header">
        <h1>◈ Frequenzen</h1>
        <p>Notfunk-Frequenzen für Deutschland und International.</p>
      </div>

      <div class="search-box">
        <input type="text" id="search-input" placeholder="Suchen nach Frequenz, Band oder Modus..." oninput="filterFrequencies()">
        <button class="btn btn-outline" onclick="clearSearch()">Löschen</button>
      </div>

      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterByBand('all', this)">Alle</button>
        <button class="filter-btn" onclick="filterByBand('kw', this)">Kurzwelle</button>
        <button class="filter-btn" onclick="filterByBand('ukw', this)">Ultrakurzwelle</button>
        <button class="filter-btn" onclick="filterByBand('dach', this)">D/A/CH</button>
      </div>

      <div id="frequencies-list">
        <!-- Loaded dynamically -->
      </div>
    </div>
  </main>

  <footer>
    <p>NotFunk-Nord.de | Cloudflare Workers + Pages | Hono.js</p>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/frequencies.js"></script>
</body>
</html>
